services:
  - type: web
    name: midnight-tarot-draw
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 3000
      - key: RATE_LIMIT_MAX
        value: 120
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000
